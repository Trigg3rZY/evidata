name: Task
description: A unit of work for the board (see AGENTS.md → Collaboration & workflow)
title: '<short imperative summary>'
body:
  - type: textarea
    id: what
    attributes:
      label: What & why
      description: The change and the reason; link related issues/PRs.
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Also apply the matching `priority:*` label after creating.
      options:
        - high
        - medium
        - low
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance / done-when
      description: How we'll know it's done (tests, behavior, verification).
    validations:
      required: false
  - type: input
    id: depends_on
    attributes:
      label: Depends on
      description: Issues that must merge first, e.g. `#12, #15`. Leave blank if none. Label `blocked` while waiting.
    validations:
      required: false
  - type: input
    id: touches
    attributes:
      label: Touches (paths)
      description: Main dirs/packages this will change (helps parallel agents stay file-disjoint), e.g. `packages/db, apps/web/lib`.
    validations:
      required: false
