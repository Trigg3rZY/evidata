version: 2
updates:
  # Keep GitHub Actions pinned-by-SHA fresh: Dependabot bumps the SHA + the
  # version comment, and proposes major upgrades for review. Grouped weekly to
  # keep the noise to one PR.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: ci
